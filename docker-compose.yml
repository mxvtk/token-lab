services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tokenlab
      POSTGRES_PASSWORD: tokenlab
      POSTGRES_DB: tokenlab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenlab"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      PGHOST: db
      PGUSER: tokenlab
      PGPASSWORD: tokenlab
      PGDATABASE: tokenlab
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - api
